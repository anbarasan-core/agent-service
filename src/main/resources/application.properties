spring.application.name=agent-service
server.port=8082

spring.datasource.url=${POSTGRESQL_URL}
spring.datasource.username=${POSTGRESQL_USERNAME}
spring.datasource.password=${POSTGRESQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

alturion.policyowner.service = http://localhost:8080/api/policyowners/agent/
alturion.policyinfo.service = http://localhost:8081/api/policyinfo

alturion.policyinfo.service.owner.policies = /owner/policies
alturion.policyinfo.service.owner.policypages = /owner/policies-pages